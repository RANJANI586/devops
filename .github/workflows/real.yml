name: Devops-pipeline
on: workflow_dispatch

jobs:
  build-jobs:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v6
        with:
          ref: main

      - name: get pem file
        run: |
          echo "${{secrets.Ranjani___}}" > Ranjani.pem
          chmod 400 Ranjani.pem
          ls -lrsth
      - name: cp app.py
        run: scp -o StrictHostKeyChecking=no -i Ranjani.pem app.py ec2-user@15.135.218.160:/home/ec2-user/
      - name: cp req.txt
        run: scp -o StrictHostKeyChecking=no -i Ranjani.pem requirements.txt ec2-user@15.135.218.160:/home/ec2-user/ 
      - name: run app
        run: ssh -o StrictHostKeyChecking=no -i Ranjani.pem ec2-user@15.135.218.160 "cd /home/ec2-user && python3 -m venv venv && source venv/bin/activate && pip3 install -r requirements.txt && nohup python3 app.py > output.log 2>&1 & "
